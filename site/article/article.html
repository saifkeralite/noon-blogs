<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Read the latest Fieldnotes article.">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Article — Fieldnotes</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./article.css">
</head>

<body><a class="skip-link" href="#main">Skip to content</a>
    <header class="topbar"><a class="brand" href="./">fieldnotes<span>•</span></a><button class="menu-toggle"
            id="menu-toggle" aria-expanded="false" aria-controls="main-nav">Menu ☰</button>
        <nav id="main-nav" aria-label="Main navigation"><a href="./#featured">Featured</a><a href="./#insights">Latest
                insights</a><a href="./#research">Research</a><a href="./#about">About</a></nav><a class="header-cta"
            href="./#subscribe">Get the newsletter ↗</a>
    </header>
    <main id="main" class="article-main"><a class="back-link" href="./#insights">← All insights</a>
        <article id="article" class="article-content">
            <p>Loading article…</p>
        </article>
        <aside class="ad-slot" aria-label="Advertisement"><span>ADVERTISEMENT</span>
            <p>Advertisement placement</p>
        </aside>
    </main>
    <footer class="footer"><a class="brand" href="./">fieldnotes<span>•</span></a>
        <div class="footer-links"><a href="./#about">About</a><a href="./#subscribe">Newsletter</a><a
                href="mailto:hello@example.com">Contact</a></div>
        <p>© <span id="year"></span> Fieldnotes.</p>
    </footer>
    <script>document.querySelector("#year").textContent = new Date().getFullYear(); const t = document.querySelector("#menu-toggle"), n = document.querySelector("#main-nav"); t.addEventListener("click", () => { const o = n.classList.toggle("open"); t.setAttribute("aria-expanded", String(o)); });</script>
    <script src="./article.js" defer></script>
</body>

</html>
