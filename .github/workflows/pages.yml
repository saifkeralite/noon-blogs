
name: Deploy static blog to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Default: read-only repository access.
permissions:
  contents: read

# Avoid overlapping deployments.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate and validate website
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/posts.json
          test -f scripts/generate-articles.mjs

      - name: Validate JSON content
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool site/posts.json > /dev/null
          echo "posts.json is valid."

      - name: Generate article pages
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-articles.mjs

      - name: Validate generated article pages
        shell: bash
        run: |
          set -euo pipefail

          if ! find site/article -type f \
            \( -name "index.html" -o -name "*.html" \) \
            -print -quit | grep -q .; then
            echo "ERROR: No generated article HTML files found."
            exit 1
          fi

          test -f site/robots.txt
          test -f site/sitemap.xml

          echo "Generated site validation passed."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
          retention-days: 1

  deploy:
    name: Deploy website
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4